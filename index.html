<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self'; style-src 'unsafe-inline'; frame-src about:; child-src about:; base-uri 'none'; form-action 'none'">
<title>Portal do Aluno</title>
<style>
:root{--vermelho:#b5121b;--vermelho-esc:#8e0e15;--destaque:#b5121b;--ink:#1f2933;--mudo:#616e7c;--linha:#d9dee5;--fundo:#f3f3f4;--card:#fff;--suave:#f7f7f8;--ok:#18803a;--okbg:#dff3e5;--oktx:#0f5a27;--bad:#c62828;--badbg:#fde8e8;--badtx:#8a1c1c;--aviso:#8a5a00;--avisobg:#fff3c4;--avisotx:#6b4800}
@media (prefers-color-scheme:dark){:root{--destaque:#f0a8a8;--ink:#e6e9ee;--mudo:#a0aab6;--linha:#2f3742;--fundo:#14181d;--card:#1c222a;--suave:#222a33;--ok:#4cc27a;--okbg:#17301f;--oktx:#8fe0ae;--badbg:#3a1a1a;--badtx:#ffb3b3;--aviso:#f3c969;--avisobg:#33290f;--avisotx:#f3c969}}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
.topo{background:var(--vermelho);color:#fff;border-bottom:5px solid var(--vermelho-esc)}
.topo-in{max-width:1040px;margin:0 auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.topo b{font-size:18px;margin-right:12px}.topo span{opacity:.9}
.sair{display:flex;gap:10px;align-items:center;font-size:14px}
.sair button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}
.sair button:hover{background:rgba(255,255,255,.3)}
.conteudo{flex:1;width:100%;max-width:1040px;margin:0 auto;padding:28px 16px}
.rodape{text-align:center;color:var(--mudo);font-size:13px;padding:18px 16px}
h1{font-size:26px;margin:.1em 0;line-height:1.2}
h2{font-size:19px;margin:0 0 4px}
.sub{color:var(--mudo);margin:.3em 0}.eyebrow{margin:0;color:var(--mudo);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.login{max-width:400px;margin:24px auto;background:var(--card);border:1px solid var(--linha);border-top:5px solid var(--vermelho);border-radius:10px;padding:28px}
.login h1{font-size:24px}
.login form{display:flex;flex-direction:column;gap:6px;margin-top:16px}
label{font-weight:600;font-size:14px;margin-top:8px}
input{font:inherit;padding:10px 12px;border:1px solid var(--linha);border-radius:8px;background:var(--fundo);color:var(--ink)}
input:focus{outline:2px solid var(--vermelho);outline-offset:1px}
.btn{display:inline-block;margin-top:16px;background:var(--vermelho);color:#fff;border:0;border-radius:8px;padding:11px 16px;font:600 16px "Segoe UI",system-ui,Arial,sans-serif;cursor:pointer}
.btn:hover{background:var(--vermelho-esc)}.btn:disabled{opacity:.6;cursor:wait}
.btn.sec{background:transparent;color:var(--destaque);border:1px solid var(--destaque);margin-top:12px;font-size:14px;padding:8px 12px}
.btn.sec:hover{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
.lnk{background:none;border:0;padding:0;font:inherit;font-size:13px;color:var(--destaque);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.aviso{margin-top:14px;padding:10px 14px;border-radius:8px;font-size:15px}
.aviso.erro{background:var(--badbg);color:var(--badtx);border:1px solid #f3b4b4}
.dica{color:var(--mudo);font-size:13px;margin:16px 0 0}
.card{background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:22px;margin-bottom:20px}
.cab{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.sit{display:inline-block;padding:4px 12px;border-radius:99px;font-size:14px;font-weight:600;background:var(--linha);color:var(--ink);white-space:nowrap}
.sit.ok{background:var(--okbg);color:var(--oktx)}.sit.bad{background:var(--badbg);color:var(--badtx)}.sit.and{background:var(--avisobg);color:var(--avisotx)}
/* painel N1 | N2 | Média */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}
.tile{border:1px solid var(--linha);border-radius:10px;padding:16px;background:var(--suave);display:flex;flex-direction:column;gap:2px}
.tile.media{border-color:var(--vermelho);border-width:2px}
.tile .rot{font-size:13px;color:var(--mudo);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.tile .val{font-size:40px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .val small{font-size:15px;color:var(--mudo);font-weight:400}
.tile.media .val{color:var(--destaque)}
.tile.pend .val{color:var(--mudo)}
.tile .obs{font-size:13px;color:var(--mudo)}
.barra{height:8px;background:var(--linha);border-radius:99px;overflow:hidden;margin-top:8px}
.barra i{display:block;height:100%;background:var(--ok);border-radius:99px}
.tile.media .barra i{background:var(--vermelho)}
.meta{margin:16px 0 0;padding:10px 14px;border-radius:8px;background:var(--avisobg);color:var(--avisotx);font-size:15px}
/* composição */
.formula{font-size:15px;background:var(--suave);border-radius:8px;padding:10px 14px;margin:14px 0 4px;font-variant-numeric:tabular-nums;overflow-x:auto;white-space:nowrap}
.formula b{color:var(--destaque)}
.comp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:14px}
.parte{border:1px solid var(--linha);border-radius:10px;padding:16px}
.parte h3{margin:0;font-size:16px;display:flex;justify-content:space-between;gap:8px}
.parte h3 span{color:var(--mudo);font-weight:400;font-size:14px}
.parte table{width:100%;border-collapse:collapse;margin-top:10px;font-size:15px}
.parte td{padding:7px 0;border-bottom:1px solid var(--linha);vertical-align:middle}
.parte td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:10px}
.parte td small{display:block;color:var(--mudo);font-size:12px}.parte td.n small{display:inline}
.parte tr.tot td{border-bottom:0;border-top:2px solid var(--ink);font-weight:700;padding-top:9px}
.parte tr.sub2 td{color:var(--mudo);font-size:13px;padding:4px 0 4px 14px}
.parte tr.pend td{color:var(--aviso)}
.n2 .parte{border-style:dashed}
.n2 .vazio{color:var(--mudo);font-size:14px;margin:10px 0 0}
/* devolutivas */
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:14px}
.elem{border:1px solid var(--linha);border-radius:10px;padding:16px;display:flex;flex-direction:column}
.elem h3{margin:0;font-size:16px}.elem .tipo{color:var(--mudo);font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin:0 0 2px}
.nota{font-size:26px;font-weight:700;margin:.2em 0 0;font-variant-numeric:tabular-nums}.nota small{font-size:14px;color:var(--mudo);font-weight:400}
.elem ul{list-style:none;padding:0;margin:12px 0 0;flex:1}
.elem li{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--linha);font-size:14px}
.elem li.pend{color:var(--aviso)}
.elem .btn{margin-top:12px;align-self:flex-start}
.barra-q{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.barra-q .btn{margin:0}
iframe.rel{width:100%;height:calc(100vh - 210px);min-height:420px;border:1px solid var(--linha);border-radius:10px;background:#fff}
@media (max-width:760px){.tiles{grid-template-columns:1fr}.comp{grid-template-columns:1fr}.tile .val{font-size:34px}.card{padding:18px}}
</style></head><body>
<header class="topo"><div class="topo-in"><div><b id="escola"></b><span>Portal do Aluno</span></div>
<div class="sair" id="sair" hidden><span id="quem"></span><button type="button" id="btnSair">Sair</button></div></div></header>
<main class="conteudo" id="app"></main>
<footer class="rodape" id="rodape"></footer>
<script src="config.js"></script>
<script>
/* Cifra v2 do Portal do Professor.
   id    = SHA-256(sal || RA)[0..32 hex]
   chave = PBKDF2-SHA256(RA + ":" + palavra normalizada, sal16, iter) -> AES-256-GCM
   blob  = base64( sal16 | iv12 | texto cifrado ) */
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.Cripto = factory();
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";
  const enc = new TextEncoder(), dec = new TextDecoder();
  const subtle = () => (globalThis.crypto || self.crypto).subtle;
  const rnd = n => { const b = new Uint8Array(n); (globalThis.crypto || self.crypto).getRandomValues(b); return b; };
  const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
  const toB64 = u8 => { let s = ""; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return btoa(s); };
  const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  /* minúsculas, sem acentos, só letras e dígitos (aceita "bodu kefa" ou "bodu-kefa") */
  const normPalavra = s => String(s).toLowerCase().normalize("NFD").replace(/\p{M}/gu, "").replace(/[^a-z0-9]/g, "");
  const normRA = s => String(s).replace(/\D/g, "");

  async function idArquivo(sal, ra) {
    return hex(await subtle().digest("SHA-256", enc.encode(sal + normRA(ra)))).slice(0, 32);
  }
  async function chave(ra, palavra, salt, iter) {
    const mat = await subtle().importKey("raw", enc.encode(normRA(ra) + ":" + normPalavra(palavra)), "PBKDF2", false, ["deriveKey"]);
    return subtle().deriveKey({ name: "PBKDF2", hash: "SHA-256", salt, iterations: iter }, mat, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  }
  async function cifrar(obj, ra, palavra, iter) {
    const salt = rnd(16), iv = rnd(12);
    const k = await chave(ra, palavra, salt, iter);
    const ct = new Uint8Array(await subtle().encrypt({ name: "AES-GCM", iv }, k, enc.encode(JSON.stringify(obj))));
    const out = new Uint8Array(28 + ct.length);
    out.set(salt, 0); out.set(iv, 16); out.set(ct, 28);
    return toB64(out);
  }
  async function decifrar(b64, ra, palavra, iter) {
    const b = fromB64(b64);
    const k = await chave(ra, palavra, b.slice(0, 16), iter);
    const pt = await subtle().decrypt({ name: "AES-GCM", iv: b.slice(16, 28) }, k, b.slice(28));
    return JSON.parse(dec.decode(pt));
  }
  return { idArquivo, cifrar, decifrar, normPalavra, normRA, rnd, hex };
});

</script>
<script>
"use strict";
const CFG = window.PORTAL_CFG || {cab:{}, sal:"", iter:600000};
const CAB = CFG.cab || {};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const f2 = (n, c) => n === null || n === undefined || isNaN(n) ? "—" : Number(n).toFixed(c === undefined ? 2 : c).replace(".", ",");
const pct = n => Math.max(0, Math.min(100, (n || 0) * 10));
let dados = null;
document.title = "Portal do Aluno — " + (CAB.disciplina || "");
$("#escola").textContent = (CAB.instituicao || "") + " ";
$("#rodape").textContent = [CAB.disciplina, CAB.curso, CAB.professor, CAB.semestre].filter(Boolean).join(" · ");

function login(msg, ra) {
  dados = null; $("#sair").hidden = true;
  $("#app").innerHTML = `<section class="login"><h1>Portal do Aluno</h1>
  <p class="sub">${esc(CAB.disciplina || "")}<br>${esc(CAB.curso || "")}<br>${esc(CAB.professor || "")} · ${esc(CAB.semestre || "")}</p>
  ${msg ? `<div class="aviso erro" role="alert">${esc(msg)}</div>` : ""}
  <form id="f" autocomplete="off"><label for="ra">RA</label>
  <input id="ra" inputmode="numeric" required autofocus value="${esc(ra || "")}" placeholder="Seu RA (apenas dígitos)">
  <label for="pw">Palavra secreta</label><input id="pw" type="password" required placeholder="Ex.: bodu-kefa-miti-zolo">
  <button class="btn" id="ok" type="submit">Entrar</button></form>
  <p class="dica">Use o RA e a palavra secreta que você recebeu do professor. Você só tem acesso às suas próprias notas.</p></section>`;
  $("#f").onsubmit = async ev => {
    ev.preventDefault();
    const ra = Cripto.normRA($("#ra").value), pw = $("#pw").value;
    $("#ok").disabled = true; $("#ok").textContent = "Verificando…";
    try { await entrar(ra, pw); } catch (e) { login(e.message, ra); }
  };
}

function carrega(h) {
  return new Promise(res => {
    if (window.__D && window.__D[h]) return res(window.__D[h]);
    const sc = document.createElement("script"); sc.src = "d/" + h + ".js";
    sc.onload = () => { sc.remove(); res((window.__D || {})[h] || null); };
    sc.onerror = () => { sc.remove(); res(null); };
    document.head.appendChild(sc);
  });
}

const ERRO = "RA ou palavra secreta inválidos. Confira os dados digitados.";
async function entrar(ra, pw) {
  if (ra.length < 5) throw new Error(ERRO);
  const id = await Cripto.idArquivo(CFG.sal, ra);
  const b64 = await carrega(id);
  if (!b64) throw new Error(ERRO);
  try { dados = await Cripto.decifrar(b64, ra, pw, CFG.iter); } catch (e) { throw new Error(ERRO); }
  $("#quem").textContent = dados.nome; $("#sair").hidden = false; painel();
}

const clsSit = s => s === "Aprovado" ? "ok" : s === "Abaixo da média" ? "bad" : s === "Em andamento" ? "and" : "";
const idxEl = id => dados.elementos.findIndex(e => e.id === id);
const btnDev = id => { const i = idxEl(id); return i >= 0 && dados.elementos[i].devolutiva ? ` <button class="lnk" data-e="${i}">ver correção</button>` : ""; };

function painel() {
  if (!dados.semestre) return painelElementos();
  const d = dados, s = d.semestre, c = d.casas || 2, P = s.pesos, min = d.media_min;
  const tile = (rot, n, obs, extra) => `<div class="tile ${extra || ""} ${n === null ? "pend" : ""}"><span class="rot">${rot}</span>
    <span class="val">${f2(n, c)} <small>/ 10</small></span><div class="barra"><i style="width:${pct(n)}%"></i></div><span class="obs">${obs}</span></div>`;
  $("#app").innerHTML = `<section class="card"><div class="cab"><div><p class="eyebrow">Aluno(a)</p><h1>${esc(d.nome)}</h1><p class="sub">RA ${esc(d.ra)}</p></div>
  <span class="sit ${clsSit(s.situacao)}">${esc(s.situacao)}</span></div>
  <div class="tiles">
    ${tile("Nota N1", s.n1.nota, s.n1.lancado ? `Atividades ${P.ativ}% + Avaliação ${P.aval}%` : "Ainda não lançada")}
    ${tile("Nota N2", s.n2.nota, s.n2.lancado ? `Atividades ${P.ativ}% + Avaliação ${P.aval}%` : "Ainda não realizada (outubro e novembro)")}
    ${tile("Média do semestre", s.media, s.media === null ? "(N1 + N2) ÷ 2 — aguardando a N2" : `(N1 + N2) ÷ 2 · mínima ${f2(min, c)}`, "media")}
  </div>
  ${s.necessaria === null ? "" : s.necessaria > 10
    ? `<p class="meta">Mesmo com N2 = 10,00 a média do semestre não alcança ${f2(min, c)}. Converse com o professor.</p>`
    : `<p class="meta">Para alcançar a média ${f2(min, c)} no semestre, você precisa de <b>N2 ≥ ${f2(s.necessaria, c)}</b>.</p>`}
  </section>
  ${secaoBimestre("N1", s.n1, P, c, "Referente a agosto e setembro.")}
  ${secaoBimestre("N2", s.n2, P, c, "Referente a outubro e novembro.")}
  ${d.elementos.length ? `<section class="card"><h2>Correções e devolutivas</h2><p class="sub">Nota de cada elemento avaliativo em 0–10 e o relatório de correção individual.</p>
  <div class="grade">${d.elementos.map((e, i) => `<article class="elem"><p class="tipo">${esc(rotComp(e.comp))}</p><h3>${esc(e.nome)}</h3>
  <p class="nota">${esc(e.nota_txt)} <small>/ 10,00</small></p><div class="barra"><i style="width:${e.pct}%"></i></div>
  ${e.questoes.length > 1 ? `<ul>${e.questoes.map(q => `<li class="${q.lancada ? "" : "pend"}"><span>${esc(q.rotulo)}</span><b>${esc(q.valor_txt)} / ${esc(q.max_txt)}</b></li>`).join("")}</ul>` : ""}
  ${e.devolutiva ? `<button class="btn sec" data-e="${i}">Ver devolutiva</button>` : ""}</article>`).join("")}</div></section>` : ""}`;
  liga(); window.scrollTo(0, 0);
}

const ROT = { "N1-prova": "N1 · Prova", "N1-ativ": "N1 · Atividade", "N1-bonus": "N1 · Bônus", "N2-prova": "N2 · Prova", "N2-ativ": "N2 · Atividade", "N2-bonus": "N2 · Bônus" };
const rotComp = k => ROT[k] || "Elemento avaliativo";

function secaoBimestre(b, n, P, c, periodo) {
  const linha = (it, valor, max) => `<tr class="${it.lancada ? "" : "pend"}"><td>${esc(it.nome)}${btnDev(it.id)}</td><td class="n">${it.lancada ? valor : "não lançada"}${it.lancada && max ? ` <small>/ ${max}</small>` : ""}</td></tr>`;
  if (!n.lancado) {
    return `<section class="card n2"><h2>Composição da ${b}</h2><p class="sub">${periodo} <b>Ainda não realizada.</b></p>
    <div class="comp"><div class="parte"><h3>Atividades ${b} <span>${P.ativ}%</span></h3><p class="vazio">Média aritmética das atividades ${b}-1, ${b}-2 e ${b}-3.</p>
    ${n.ativ.itens.length ? `<table>${n.ativ.itens.map(it => linha(it, "", "")).join("")}</table>` : ""}</div>
    <div class="parte"><h3>Avaliação ${b} <span>${P.aval}%</span></h3><p class="vazio">Prova ${b}${n.bonus.itens.length ? " + atividade bônus" : ""}.</p></div></div></section>`;
  }
  const provaItens = n.prova.itens.map(it => { const e = dados.elementos[idxEl(it.id)];
    return `<tr class="sub2 ${it.lancada ? "" : "pend"}"><td>${esc(it.nome)}${btnDev(it.id)}</td><td class="n">${e ? `${esc(e.soma_txt)} / ${esc(e.max_txt)}` : f2(it.nota, c)}</td></tr>`; }).join("");
  const bonusItens = n.bonus.itens.map(it => `<tr class="sub2 ${it.lancada ? "" : "pend"}"><td>${esc(it.nome)} — nota ${it.lancada ? f2(it.nota, c) : "—"} × ${f2(P.bonus_max * 10, 0)}%${btnDev(it.id)}</td><td class="n"></td></tr>`).join("");
  const somaPV = n.prova.nota + n.bonus.pontos;
  return `<section class="card"><h2>Composição da ${b}</h2><p class="sub">${periodo}</p>
  <div class="formula">${b} = ${P.ativ}% × <b>${f2(n.ativ.nota, c)}</b> (atividades) + ${P.aval}% × <b>${f2(n.aval, c)}</b> (avaliação) = <b>${f2(n.nota, c)}</b></div>
  <div class="comp">
    <div class="parte"><h3>Atividades ${b} <span>${P.ativ}% da ${b}</span></h3><table>
      ${n.ativ.itens.map(it => linha(it, f2(it.nota, c), "10")).join("") || `<tr><td colspan="2" class="sub">Nenhuma atividade lançada.</td></tr>`}
      <tr class="tot"><td>Média aritmética</td><td class="n">${f2(n.ativ.nota, c)}</td></tr></table></div>
    <div class="parte"><h3>Avaliação ${b} <span>${P.aval}% da ${b}</span></h3><table>
      <tr class="${n.prova.lancado ? "" : "pend"}"><td>Prova ${b}<small>${n.prova.lancado ? `${f2(n.prova.soma)} de ${f2(n.prova.max)} pontos` : "não lançada"}</small></td><td class="n">${f2(n.prova.nota, c)}</td></tr>
      ${provaItens}
      ${n.bonus.itens.length ? `<tr><td>Atividade bônus<small>até +${f2(P.bonus_max)} ponto na prova</small></td><td class="n">+${f2(n.bonus.pontos)}</td></tr>${bonusItens}` : ""}
      <tr class="tot"><td>Avaliação ${b}${somaPV > 10 ? "<small>limitada a 10,00</small>" : ""}</td><td class="n">${f2(n.aval, c)}</td></tr></table></div>
  </div></section>`;
}

/* compatibilidade com arquivos publicados antes da composição semestral */
function painelElementos() {
  const d = dados;
  $("#app").innerHTML = `<section class="card"><p class="eyebrow">Aluno(a)</p><h1>${esc(d.nome)}</h1><p class="sub">RA ${esc(d.ra)}</p>
  <p class="sub">Média ponderada dos elementos: <b>${esc(d.final_txt)}</b> · ${esc(d.situacao)}</p></section>
  <section class="grade">${d.elementos.map((e, i) => `<article class="elem card"><h3>${esc(e.nome)}</h3>
  <p class="nota">${esc(e.nota_txt)} <small>/ 10,00</small></p><div class="barra"><i style="width:${e.pct}%"></i></div>
  <ul>${e.questoes.map(q => `<li class="${q.lancada ? "" : "pend"}"><span>${esc(q.rotulo)}</span><b>${esc(q.valor_txt)} / ${esc(q.max_txt)}</b></li>`).join("")}</ul>
  ${e.devolutiva ? `<button class="btn sec" data-e="${i}">Ver devolutiva</button>` : ""}</article>`).join("")}</section>`;
  liga(); window.scrollTo(0, 0);
}

function liga() { document.querySelectorAll("[data-e]").forEach(b => b.onclick = () => devolutiva(+b.dataset.e)); }

function devolutiva(i) {
  const e = dados.elementos[i];
  const css = "body{font:16px/1.55 Segoe UI,system-ui,Arial,sans-serif;color:#1f2933;margin:20px;max-width:820px}h2,h3,h4{color:#8e0e15;margin:1.2em 0 .4em}pre{background:#f3f3f4;padding:10px;border-radius:6px;overflow:auto}code{background:#f3f3f4;padding:1px 4px;border-radius:4px;font-family:Consolas,monospace}";
  $("#app").innerHTML = `<div class="barra-q"><button class="btn sec" id="vol">← Painel de notas</button>
  ${dados.elementos.map((x, j) => x.devolutiva && j !== i ? `<button class="btn sec" data-e="${j}">${esc(x.nome)}</button>` : "").join("")}</div>
  <iframe class="rel" sandbox="" title="Devolutiva"></iframe>`;
  $("iframe.rel").srcdoc = e.devolutiva_fmt === "html" ? e.devolutiva : `<!DOCTYPE html><meta charset="utf-8"><style>${css}</style><h2>${esc(e.nome)} — devolutiva</h2>${e.devolutiva}`;
  $("#vol").onclick = painel;
  liga(); window.scrollTo(0, 0);
}

$("#btnSair").onclick = () => login();
login();
</script></body></html>
